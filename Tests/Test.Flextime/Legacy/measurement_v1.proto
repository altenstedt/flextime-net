syntax = "proto3";

// measurement.proto as it was before places (field 4) were added,
// kept so tests can prove old readers still parse new files.
option csharp_namespace = "Test.Flextime.Legacy";

message Measurement {
  enum Kind {
    NONE = 0;
    MEASUREMENT = 1;
    START = 2;
    STOP = 3;
    SESSION_LOCK = 4;
    SESSION_UNLOCK = 5;
  }
  
  uint32 timestamp = 1;
  Kind kind = 2;
  uint32 idle = 3;
}

message Measurements {
  uint32 interval = 1;
  string zone = 2;
  repeated Measurement measurements = 3;
}
